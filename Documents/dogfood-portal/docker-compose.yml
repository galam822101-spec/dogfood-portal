version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dogfood_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dogfood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: dogfood_app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/dogfood
      - PORT=8080
    depends_on:
      - db

volumes:
  pgdata:
